# JupyterHub on single-node k3s, 7 x MIG 1g.18gb slices on one H200.
#
# Per-user grants are deliberately far below what the box could give out: with
# 7 slices, the worst case is 7 x memory.limit, and the guarantees are what the
# scheduler actually reserves. See docs/OPERATIONS.md for the sizing arithmetic.

hub:
  # Let a user grant a colleague access to their own running server -- JupyterHub
  # 5's native sharing, and the closest safe equivalent to Colab's "share this
  # notebook". Deliberately NOT jupyter-collaboration: that package's extension
  # is incompatible with JupyterLab 4.6 and disables the core file browser when
  # installed. `shares!user` means a user can only share a server they own.
  #
  # This MUST go in hub.loadRoles, not hub.config.JupyterHub.load_roles. The
  # chart builds load_roles from an empty list and appends its own entries --
  # including the role the idle culler authenticates with -- and a value set via
  # hub.config lands last and replaces the whole list. Doing that silently breaks
  # culling with a 403 on every poll, so idle servers hold their MIG slice
  # forever, which is the one failure this deployment cannot absorb.
  loadRoles:
    user:
      name: user
      scopes:
        - self
        - shares!user

  image:
    name: local/k8s-hub-native      # custom: stock hub + jupyterhub-nativeauthenticator
    tag: "4.4.2"                    # MUST match chart version
    pullPolicy: Never               # image lives in k3s containerd, not a registry
  # Branding + onboarding copy live in a ConfigMap so they can be changed without
  # rebuilding the hub image. Mounted read-only; templates/ is prepended to the
  # template search path in extraConfig below.
  extraVolumes:
    - name: custom-templates
      configMap:
        name: hub-custom-templates
  extraVolumeMounts:
    - name: custom-templates
      mountPath: /etc/jupyterhub/custom-templates
      readOnly: true
  extraEnv:
    # Optional. When set, users whose signup email matches SELF_APPROVAL_DOMAINS
    # are emailed an approval link instead of waiting on a human. Unset = every
    # signup waits for manual approval at /hub/authorize.
    RESEND_API_KEY:
      valueFrom:
        secretKeyRef:
          name: hub-extras
          key: resend-api-key
          optional: true
    APPROVAL_FROM_EMAIL:
      valueFrom:
        secretKeyRef:
          name: hub-extras
          key: approval-from-email
          optional: true
    SELF_APPROVAL_DOMAINS:
      valueFrom:
        secretKeyRef:
          name: hub-extras
          key: self-approval-domains
          optional: true
    RECAPTCHA_KEY:
      valueFrom:
        secretKeyRef:
          name: hub-extras
          key: recaptcha-key
          optional: true
    RECAPTCHA_SECRET:
      valueFrom:
        secretKeyRef:
          name: hub-extras
          key: recaptcha-secret
          optional: true
  config:
    JupyterHub:
      authenticator_class: nativeauthenticator.NativeAuthenticator
      admin_access: true
    Authenticator:
      # JupyterHub 5 defaults allow_all=False, and an empty allowed_users no
      # longer means "everyone" -> every login is refused with "not allowed".
      # NativeAuthenticator does its own gating (is_authorized / admin approval),
      # so delegate to it. Approval is still required; this is not open access.
      allow_all: true
      admin_users:
        - admin
    NativeAuthenticator:
      open_signup: false            # admin approves each signup at /hub/authorize
      minimum_password_length: 12
      check_common_password: true
      ask_email_on_signup: true     # without this there is no way to contact a user
      # Brute-force protection. Both default to 0, i.e. unlimited guesses against
      # a login form that is reachable from the open internet.
      allowed_failed_logins: 5
      seconds_before_next_try: 900
      # The username becomes the pod name AND the PVC name, so it has to be a
      # safe DNS label. Without this, signup accepts names that produce an
      # unspawnable server and a confusing failure much later.
      username_pattern: '^[a-z][a-z0-9-]{2,30}$'
  extraConfig:
    # JupyterHub 5.5's LoginHandler.render_template intercepts error.html on POST
    # and routes it into _render(**ns). NativeAuthenticator overrides _render(), which
    # (a) has no `sync` parameter and (b) returns a coroutine -- so synchronous error
    # rendering raises and the user gets a bare, body-less HTTP 403 instead of
    # "Login form invalid or expired. Try again."  Bypass the interception: render
    # error pages through the base implementation, which honours sync=True.
    01-nativeauth-render-fix: |
      from jupyterhub.handlers.base import BaseHandler as _JHBase
      from nativeauthenticator.handlers import LoginHandler as _NALoginHandler
      _NALoginHandler.render_template = _JHBase.render_template
    00-nativeauth: |
      import os, nativeauthenticator
      # Our overrides first, NativeAuthenticator's originals second: Jinja takes
      # the first match, so this themes the login/signup pages without forking
      # the package's templates.
      c.JupyterHub.template_paths = [
          "/etc/jupyterhub/custom-templates",
          f"{os.path.dirname(nativeauthenticator.__file__)}/templates/",
      ]
      c.JupyterHub.logo_file = "/etc/jupyterhub/custom-templates/logo.png"
      # Rendered into the announcement block on the login page only.
      # NativeAuthenticator's native-login.html honours announcement_login; its
      # signup.html has no announcement hook, so signup guidance lives in the
      # footer block of our page.html instead.
      c.JupyterHub.template_vars = {
          "announcement_login":
              'No account yet? <a href="signup">Request access</a>. '
              'Sign-in locks for 15 minutes after 5 failed attempts.',
      }
    # Self-service approval by email. NativeAuthenticator ships this, but its
    # send_approval_email() calls smtplib.SMTP_SSL(), which talks port 465 --
    # and DigitalOcean blocks outbound 25/465/587, so the stock path can only
    # ever raise 503. Port 2525 is open, but SMTP_SSL cannot use it (2525 is
    # STARTTLS, not implicit TLS). Send over the Resend HTTPS API instead, which
    # needs nothing but 443.
    02-approval-email-over-https: |
      import os
      _domains = os.environ.get("SELF_APPROVAL_DOMAINS", "").strip()
      _key     = os.environ.get("RESEND_API_KEY", "").strip()
      _from    = os.environ.get("APPROVAL_FROM_EMAIL", "").strip()

      if _domains and _key and _from:
          import json, urllib.request
          from nativeauthenticator import NativeAuthenticator
          from tornado import web

          def _send_approval_email(self, dest, url):
              body = (
                  "You have been approved to use the notebook service.\n\n"
                  f"Activate your account here:\n{url}\n\n"
                  "If you did not request this account, ignore this email."
              )
              payload = json.dumps({
                  "from": _from, "to": [dest],
                  "subject": "Activate your notebook account",
                  "text": body,
              }).encode()
              req = urllib.request.Request(
                  "https://api.resend.com/emails", data=payload, method="POST",
                  headers={"Authorization": f"Bearer {_key}",
                           "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      r.read()
              except Exception as e:
                  self.log.error("approval email failed: %s", e)
                  raise web.HTTPError(503, reason=(
                      "Could not send the activation email. "
                      "Contact the administrator."))

          NativeAuthenticator.send_approval_email = _send_approval_email
          # Anchored: a bare domain regex would also match evil-example.com.
          c.NativeAuthenticator.allow_self_approval_for = (
              r"^[^@]+@(" + "|".join(d.strip().replace(".", r"\.")
                                     for d in _domains.split(",") if d.strip()) + r")$"
          )

      # reCAPTCHA on the public signup form. Only enabled when both keys exist,
      # so an unconfigured deploy fails open to "admin approves manually" rather
      # than to a broken form.
      _rk, _rs = os.environ.get("RECAPTCHA_KEY", ""), os.environ.get("RECAPTCHA_SECRET", "")
      if _rk and _rs:
          c.NativeAuthenticator.recaptcha_key = _rk
          c.NativeAuthenticator.recaptcha_secret = _rs

    # Per-user usage accounting. JupyterHub only remembers the *current* server's
    # start time, so "how many GPU hours has this person used" is unanswerable
    # from its own database. This records one row per server session (user,
    # profile, GPU or not, start, stop) in a small SQLite file on the hub's PVC
    # and serves an admin-only summary at /hub/usage (?format=csv for export).
    # Counting starts the day this is deployed; there is no history before it.
    03-usage-accounting: |
      import csv, io, sqlite3, time
      from datetime import datetime, timedelta, timezone
      from kubespawner import KubeSpawner
      from jupyterhub.handlers.base import BaseHandler
      from tornado import web

      USAGE_DB = "/srv/jupyterhub/usage.sqlite"   # same PVC as jupyterhub.sqlite

      def _usage_db():
          con = sqlite3.connect(USAGE_DB)
          con.execute("""
              CREATE TABLE IF NOT EXISTS sessions (
                  id       INTEGER PRIMARY KEY,
                  username TEXT NOT NULL,
                  server   TEXT NOT NULL DEFAULT '',
                  profile  TEXT NOT NULL DEFAULT '',
                  gpu      INTEGER NOT NULL DEFAULT 0,
                  started  REAL NOT NULL,          -- unix seconds, UTC
                  stopped  REAL                    -- NULL while running
              )""")
          con.execute("CREATE INDEX IF NOT EXISTS ix_sessions_user ON sessions(username)")
          return con

      class UsageSpawner(KubeSpawner):
          """KubeSpawner that logs each session to the usage table."""

          def _usage_profile(self):
              slug = (self.user_options or {}).get("profile") or ""
              try:
                  plist = self._get_initialized_profile_list(
                      self._sorted_dict_values(self.profile_list))
                  return self._get_profile(slug, plist)["display_name"]
              except Exception:
                  return slug

          async def start(self):
              result = await super().start()
              # Only a successful start counts: a failed spawn holds no slice.
              gpu = int(any("nvidia" in k for k in (self.extra_resource_limits or {})))
              try:
                  with _usage_db() as con:
                      # A session left open by an unclean hub restart is closed
                      # here rather than double-counted.
                      con.execute("UPDATE sessions SET stopped=started WHERE username=? AND server=? AND stopped IS NULL",
                                  (self.user.name, self.name))
                      con.execute("INSERT INTO sessions(username, server, profile, gpu, started) VALUES (?,?,?,?,?)",
                                  (self.user.name, self.name, self._usage_profile(), gpu, time.time()))
              except Exception:
                  self.log.exception("usage accounting: could not record start")
              return result

          async def run_post_stop_hook(self):
              # User.stop() runs this in a `finally`, so it fires for every way a
              # server ends: user stop, idle cull, pod crash, and pods found dead
              # after a hub restart. In that last case the true stop time is
              # unknown and "now" over-counts by however long the hub was down.
              try:
                  with _usage_db() as con:
                      con.execute("UPDATE sessions SET stopped=? WHERE username=? AND server=? AND stopped IS NULL",
                                  (time.time(), self.user.name, self.name))
              except Exception:
                  self.log.exception("usage accounting: could not record stop")
              return await super().run_post_stop_hook()

      c.JupyterHub.spawner_class = UsageSpawner

      class UsageHandler(BaseHandler):
          """GET /hub/usage — admin-only per-user totals, HTML or CSV."""

          PERIODS = {"month": "This month", "30d": "Last 30 days", "all": "All time"}

          @web.authenticated
          async def get(self):
              if not self.current_user.admin:
                  raise web.HTTPError(403, "Administrators only")
              period = self.get_argument("period", "month")
              if period not in self.PERIODS:
                  period = "month"
              now = time.time()
              if period == "month":
                  since = datetime.now(timezone.utc).replace(day=1, hour=0, minute=0, second=0, microsecond=0).timestamp()
              elif period == "30d":
                  since = now - 30 * 86400
              else:
                  since = 0.0

              with _usage_db() as con:
                  rows = con.execute(
                      "SELECT username, server, profile, gpu, started, stopped FROM sessions "
                      "WHERE stopped IS NULL OR stopped >= ? ORDER BY started DESC", (since,)).fetchall()

              per_user = {}
              recent = []
              for username, server, profile, gpu, started, stopped in rows:
                  end = stopped if stopped is not None else now
                  # Clip to the window so a session straddling its start only
                  # counts the part inside it.
                  secs = max(0.0, end - max(started, since))
                  u = per_user.setdefault(username, {
                      "username": username, "gpu_secs": 0.0, "cpu_secs": 0.0,
                      "sessions": 0, "last": 0.0, "running": False})
                  u["gpu_secs" if gpu else "cpu_secs"] += secs
                  u["sessions"] += 1
                  u["last"] = max(u["last"], end)
                  u["running"] = u["running"] or stopped is None
                  if len(recent) < 50:
                      recent.append({"username": username, "profile": profile, "gpu": bool(gpu),
                                     "started": started, "stopped": stopped,
                                     "secs": end - started, "running": stopped is None})

              users = sorted(per_user.values(), key=lambda u: (-u["gpu_secs"], -u["cpu_secs"], u["username"]))
              total_gpu = sum(u["gpu_secs"] for u in users)
              total_cpu = sum(u["cpu_secs"] for u in users)

              if self.get_argument("format", "") == "csv":
                  buf = io.StringIO()
                  w = csv.writer(buf)
                  w.writerow(["username", "gpu_hours", "cpu_hours", "sessions", "last_active_utc"])
                  for u in users:
                      w.writerow([u["username"], f'{u["gpu_secs"]/3600:.2f}', f'{u["cpu_secs"]/3600:.2f}',
                                  u["sessions"], datetime.fromtimestamp(u["last"], timezone.utc).isoformat(timespec="seconds")])
                  self.set_header("Content-Type", "text/csv; charset=utf-8")
                  self.set_header("Content-Disposition", f'attachment; filename="usage-{period}.csv"')
                  return self.finish(buf.getvalue())

              def hours(secs):
                  return f"{secs/3600:.1f}"
              def when(ts):
                  return datetime.fromtimestamp(ts, timezone.utc).strftime("%d %b %H:%M")
              def dur(secs):
                  m = int(secs // 60)
                  if m < 1:
                      return "<1m"
                  return f"{m//60}h {m%60:02d}m" if m >= 60 else f"{m}m"

              # Computed here: the hub renders templates async, where jinja's
              # map|max filter chain cannot iterate.
              max_gpu = max((u["gpu_secs"] for u in users), default=0.0)
              running = sum(1 for u in users if u["running"])
              html = await self.render_template(
                  "usage.html", users=users, recent=recent, period=period, periods=self.PERIODS,
                  total_gpu=total_gpu, total_cpu=total_cpu, since=since, max_gpu=max_gpu, running=running,
                  hours=hours, when=when, dur=dur, sync=False)
              self.finish(html)

      c.JupyterHub.extra_handlers = [(r"/usage", UsageHandler)]

    04-agents-route: |
      # Cloud agents (agents/ in this repo): /agents/<user>/ goes to the agents router,
      # which forwards to that user's caimex server. The hub keeps this route in the
      # proxy, re-adding it after a proxy restart. Each agent does its own auth.
      c.Proxy.extra_routes = {"/agents/": "http://agents-router.agents.svc.cluster.local"}

proxy:
  service:
    type: ClusterIP                 # servicelb is disabled; cloudflared reaches this in-cluster

singleuser:
  image:
    name: local/pytorch-caimex       # pytorch-notebook + caimex CLI preinstalled
    tag: cuda12
    pullPolicy: Never                # local image in k3s containerd, not a registry
  extraEnv:
    # Shared caimex credential. Read at start by
    # /usr/local/bin/before-notebook.d/10-caimex.sh, which writes it to
    # ~/.local/share/caimex-code/auth.json (the env var alone is NOT accepted).
    CAIMEX_API_KEY:
      valueFrom:
        secretKeyRef:
          name: caimex-credentials
          key: api-key
    CAIMEX_MODEL: "caimex/Caimex2/deepseek-ai/DeepSeek-V4-Flash"
    # S3-compatible object storage (DigitalOcean Spaces). Optional: when the
    # secret is absent these are unset and 30-objectstore.sh no-ops, so notebooks
    # still start. Present -> rclone remote + ~/spaces mount, boto3/aws-cli work
    # with no further setup.
    S3_ENDPOINT:
      valueFrom: {secretKeyRef: {name: object-storage, key: endpoint,   optional: true}}
    S3_REGION:
      valueFrom: {secretKeyRef: {name: object-storage, key: region,     optional: true}}
    S3_BUCKET:
      valueFrom: {secretKeyRef: {name: object-storage, key: bucket,     optional: true}}
    AWS_ACCESS_KEY_ID:
      valueFrom: {secretKeyRef: {name: object-storage, key: access-key, optional: true}}
    AWS_SECRET_ACCESS_KEY:
      valueFrom: {secretKeyRef: {name: object-storage, key: secret-key, optional: true}}
  extraPodConfig:
    runtimeClassName: nvidia        # required so the MIG device is injected
  # Shared spaces, mounted into every server. Backed by hostPath because this is
  # a single node -- there is nothing to schedule across, and ReadWriteMany is
  # not available from local-path.
  storage:
    type: dynamic
    capacity: 10Gi                  # enforced by XFS project quota, see scripts/07
    dynamic:
      storageClass: local-path      # k3s built-in provisioner
    extraVolumes:
      - name: shared-datasets
        hostPath: {path: /srv/jupyter-shared/datasets, type: DirectoryOrCreate}
      - name: shared-team
        hostPath: {path: /srv/jupyter-shared/team, type: DirectoryOrCreate}
      # /dev/shm defaults to 64 MB in a container. PyTorch DataLoader workers use
      # it for IPC and die with a bare "bus error" when it fills.
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 2Gi}
    extraVolumeMounts:
      - name: shared-datasets
        mountPath: /home/jovyan/shared
        readOnly: true              # curated by admins; users cannot mutate it
      - name: shared-team
        mountPath: /home/jovyan/team
      - name: dshm
        mountPath: /dev/shm
  startTimeout: 600
  defaultUrl: /lab

  # Spawn-time choice. The CPU profile exists to protect the scarcest resource:
  # there are only 7 MIG slices, and without this option every login consumes
  # one even for work that never touches a GPU.
  profileList:
    - display_name: "GPU — Standard"
      description: "1 MIG slice (18 GB VRAM), 12 GB RAM, 2 CPU. Start here."
      default: true
      kubespawner_override:
        cpu_limit: 2
        cpu_guarantee: 0.5
        mem_limit: "12G"
        mem_guarantee: "1G"
        extra_resource_limits: {nvidia.com/gpu: "1"}
    - display_name: "GPU — Large"
      description: "1 MIG slice (18 GB VRAM), 24 GB RAM, 4 CPU. For large datasets held in host memory."
      kubespawner_override:
        cpu_limit: 4
        cpu_guarantee: 1
        mem_limit: "24G"
        mem_guarantee: "2G"
        extra_resource_limits: {nvidia.com/gpu: "1"}
    - display_name: "CPU only — no GPU"
      description: "8 GB RAM, 2 CPU, no GPU. Leaves a MIG slice free for someone who needs it."
      kubespawner_override:
        cpu_limit: 2
        cpu_guarantee: 0.5
        mem_limit: "8G"
        mem_guarantee: "1G"
        extra_resource_limits: {}

# Idle culling is mandatory: 7 slices total, an idle notebook holds one forever.
cull:
  enabled: true
  users: false                    # stop idle servers only; never delete accounts or home dirs
  timeout: 3600                     # 1h idle -> shut down, releasing the GPU
  every: 300
  maxAge: 0

scheduling:
  userScheduler:
    enabled: false                  # single node; nothing to spread across
