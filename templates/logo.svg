<svg xmlns="http://www.w3.org/2000/svg" width="188" height="32" viewBox="0 0 188 32" role="img" aria-label="futurezim notebooks">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="1" y="4" width="24" height="24" rx="7" fill="url(#g)"/>
  <!-- three stacked cells, echoing a notebook -->
  <rect x="6.5" y="10"   width="13" height="2.6" rx="1.3" fill="#fff" opacity=".95"/>
  <rect x="6.5" y="14.7" width="13" height="2.6" rx="1.3" fill="#fff" opacity=".72"/>
  <rect x="6.5" y="19.4" width="8"  height="2.6" rx="1.3" fill="#fff" opacity=".5"/>
  <text x="34" y="21" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="15" font-weight="700" fill="#0f172a">futurezim</text>
  <text x="116" y="21" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="15" font-weight="400" fill="#64748b">notebooks</text>
</svg>
